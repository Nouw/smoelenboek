services:
  postgres:
    image: postgres:18
    container_name: smoelenboek-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smoelenboek
      POSTGRES_USER: smoelenboek
      POSTGRES_PASSWORD: smoelenboek
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smoelenboek -d smoelenboek"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
