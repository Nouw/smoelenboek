name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semantic.outputs.new_release_version }}
      released: ${{ steps.semantic.outputs.new_release_published }}
      image_owner: ${{ steps.semantic.outputs.image_owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release
        id: semantic
        shell: bash
        run: |
          set -euo pipefail

          before="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          echo "image_owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

          pnpm exec semantic-release

          after="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [[ -n "$after" && "$after" != "$before" ]]; then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=${after#v}" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
            echo "new_release_version=" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build & Push (${{ matrix.name }})
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: rpc
            file: packages/rpc/Dockerfile
            build_args: ''
          - name: web
            file: apps/web/Dockerfile
            build_args: |
              NEXT_PUBLIC_AUTH_URL=https://api.smoelenboek.usvprotos.nl
              NEXT_PUBLIC_TRPC_URL=https://api.smoelenboek.usvprotos.nl/trpc

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build_args }}
          push: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          tags: |
            ghcr.io/${{ needs.release.outputs.image_owner }}/smoelenboek-${{ matrix.name }}:${{ needs.release.outputs.version }}
            ghcr.io/${{ needs.release.outputs.image_owner }}/smoelenboek-${{ matrix.name }}:latest

  deploy:
    name: Deploy to Proxmox
    needs: [release, docker]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          source: docker-compose.prod.yml
          target: /opt/smoelenboek/

      - name: Pull, migrate & restart
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          VERSION: ${{ needs.release.outputs.version }}
          REPO_OWNER: ${{ needs.release.outputs.image_owner }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          envs: GHCR_TOKEN,GITHUB_ACTOR,VERSION,REPO_OWNER
          script: |
            set -euo pipefail
            cd /opt/smoelenboek

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            export VERSION="$VERSION"
            export REPO_OWNER="$REPO_OWNER"

            docker compose -f docker-compose.prod.yml pull

            docker compose -f docker-compose.prod.yml up -d --wait db
            docker compose -f docker-compose.prod.yml run --rm --no-deps rpc node dist/migrate.js

            docker compose -f docker-compose.prod.yml up -d

            docker image prune -f
            echo "Deployed smoelenboek v${VERSION}"
