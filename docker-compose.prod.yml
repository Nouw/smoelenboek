services:
  web:
    image: ghcr.io/${REPO_OWNER}/smoelenboek-web:${VERSION}
    restart: unless-stopped
    env_file: .env.web
    ports:
      - "3001:3001"
    depends_on:
      - rpc

  rpc:
    image: ghcr.io/${REPO_OWNER}/smoelenboek-rpc:${VERSION}
    restart: unless-stopped
    env_file: .env.rpc
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: .env.db
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
