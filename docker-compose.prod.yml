services:
  web:
    image: ghcr.io/${REPO_OWNER}/smoelenboek-web:${VERSION}
    restart: unless-stopped
    env_file: .env.web
    ports:
      - "3001:3001"
    depends_on:
      rpc:
        condition: service_healthy

  rpc:
    image: ghcr.io/${REPO_OWNER}/smoelenboek-rpc:${VERSION}
    restart: unless-stopped
    env_file: .env.rpc
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: .env.db
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
